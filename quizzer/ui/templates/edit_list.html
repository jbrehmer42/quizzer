<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzer — Edit Questions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles_dark.css') }}">
</head>
<body class="index-body{% if dark_mode %} dark{% endif %}">
  <div class="page-header">
    <h1>Edit Questions</h1>
    <a href="{{ url_for('home') }}" class="btn btn-secondary btn-sm">&larr; Back</a>
  </div>
  <p class="subtitle">Select a question to edit its JSON representation.</p>

  {% if questions %}
  <ul class="question-list">
    {% for q in questions %}
    <li>
      <a class="question-card question-card--outcome" href="{{ url_for('edit_question', question_id=q.id_, referrer='edit_list') }}">
        <div class="question-body">
          <p class="question-text-preview">{{ q.question }}</p>
          <div class="question-meta">
            <span class="badge">{{ q.question_type }}</span>
            {% for tag in q.tags %}
            <span class="badge">{{ tag }}</span>
            {% endfor %}
          </div>
        </div>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">No questions found.</p>
  {% endif %}
</body>
</html>
