<div class="start-bar">
  <button type="submit" name="mode" value="classic" class="btn-start" id="start-btn" disabled
          title="Answer all questions, then see your results at the end.">Start Quiz</button>
  <button type="submit" name="mode" value="practice" class="btn-start btn-practice" id="practice-btn" disabled
          title="See the correct answer and explanation after each question.">Start Practice</button>
  <span id="start-label" class="start-label">Select at least one {{ noun }} to start.</span>
</div>
